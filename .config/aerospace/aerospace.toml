config-version = 2

start-at-login = false
auto-reload-config = true

after-startup-command = [
    # 'exec-and-forget borders active_color=0xfff26e27 inactive_color=0xff494d64 width=5.0',
]

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

persistent-workspaces = [
    "1", "2", "3", "4", "5", "6", "7", "8", "9",
    "A", "B", "C", "D", "E",
    "M", "N", "O", "P", "R", "S", "T", "U", "V",
    "Z"
]

on-focus-changed = ['move-mouse window-lazy-center'] # Mouse lazily follows any focus (window or workspace)
# on-focused-monitor-changed = []

focus-follows-mouse.enabled = false

automatically-unhide-macos-hidden-apps = false


# ---------------------------------------------------------------------------
# Application routing
#
# IMPORTANT:
# This needs to be at the root level of the TOML file.
# ---------------------------------------------------------------------------

on-window-detected = [
    {
        if = 'test %{app-bundle-id} = krisp && test %{window-title} = "Krisp Notification"',
        run = 'layout floating',
    },

    {
        if = 'test %{app-bundle-id} = ai.krisp.krispMac',
        run = 'move-node-to-workspace A',
    },

    {
        if = 'test %{app-bundle-id} = app.zen-browser.zen',
        run = 'move-node-to-workspace B',
    },

    {
        if = 'test %{app-bundle-id} = com.microsoft.teams2',
        run = 'move-node-to-workspace C',
    },

    {
        if = 'test %{app-bundle-id} ~= com.jetbrains.datagrip',
        run = 'move-node-to-workspace D',
    },

    {
        if = 'test %{app-bundle-id} = com.jetbrains.datagrip',
        run = 'move-node-to-workspace D',
    },

    {
        if = 'test %{app-bundle-id} = com.microsoft.Excel',
        run = 'move-node-to-workspace E',
    },

    {
        if = 'test %{app-bundle-id} = com.apple.MobileSMS',
        run = 'move-node-to-workspace M',
    },

    {
        if = 'test %{app-bundle-id} = com.tunabelly.androidsms',
        run = 'move-node-to-workspace M',
    },

    {
        if = 'test %{app-bundle-id} = com.kingsoft.wpsoffice.mac.global',
        run = 'move-node-to-workspace O',
    },

    {
        if = 'test %{app-name} ~= parallels',
        run = 'move-node-to-workspace P',
    },

    {
        if = 'test %{app-bundle-id} ~= com.jetbrains.rider',
        run = 'move-node-to-workspace R',
    },

    {
        if = 'test %{app-bundle-id} = com.spotify.client',
        run = 'move-node-to-workspace S',
    },

    {
        if = 'test %{app-bundle-id} = net.kovidgoyal.kitty',
        run = 'move-node-to-workspace T',
    },

    {
        if = 'test %{app-bundle-id} = com.github.wez.wezterm',
        run = 'move-node-to-workspace T',
    },

    {
        if = 'test %{app-bundle-id} = com.mitchellh.ghostty',
        run = 'move-node-to-workspace T',
    },

    {
        if = 'test %{app-bundle-id} = com.microsoft.VSCode',
        run = 'move-node-to-workspace V',
    },

    {
        if = 'test %{app-bundle-id} = com.microsoft.Word',
        run = 'move-node-to-workspace W',
    },

    {
        if = 'test %{app-bundle-id} = us.zoom.xos',
        run = 'move-node-to-workspace Z',
    },

    {
        if = 'test %{app-bundle-id} = com.apple.finder',
        run = 'layout floating',
    },

    {
        if = 'test %{app-bundle-id} = com.googlecode.iterm2',
        run = 'layout floating',
    },

    {
        if = 'test %{app-bundle-id} = cc.ffitch.shottr',
        run = 'layout floating',
    },

    {
        if = 'test %{app-bundle-id} = com.apple.Preview',
        run = 'layout floating',
    },
]


[key-mapping]
preset = 'qwerty'

# ---------------------------------------------------------------------------
# Gaps
# ---------------------------------------------------------------------------

[gaps]
inner.horizontal = 8
inner.vertical = 8

outer.left = 6
outer.bottom = 12
# outer.top = 12
outer.top = [{ monitor."U32J59x" = 10 }, 6]
outer.right = 6

# ---------------------------------------------------------------------------
# Main mode
#
# Hyper = Ctrl + Cmd + Alt
# Physical key: Caps Lock
# ---------------------------------------------------------------------------

[mode.main.binding]

# Layout
ctrl-cmd-alt-slash = 'layout tiles vertical horizontal'
ctrl-cmd-alt-comma = 'layout accordion vertical horizontal'

# Focus
ctrl-cmd-alt-h = 'focus left'
ctrl-cmd-alt-j = 'focus down'
ctrl-cmd-alt-k = 'focus up'
ctrl-cmd-alt-l = 'focus right'

# Move
ctrl-cmd-alt-shift-h = 'move left'
ctrl-cmd-alt-shift-j = 'move down'
ctrl-cmd-alt-shift-k = 'move up'
ctrl-cmd-alt-shift-l = 'move right'

# Resize
ctrl-cmd-alt-minus = 'resize smart -50'
ctrl-cmd-alt-equal = 'resize smart +50'

# Fullscreen
ctrl-cmd-alt-shift-f = 'fullscreen'

# ---------------------------------------------------------------------------
# Workspaces
# ---------------------------------------------------------------------------

ctrl-cmd-alt-1 = 'workspace 1'
ctrl-cmd-alt-2 = 'workspace 2'
ctrl-cmd-alt-3 = 'workspace 3'
ctrl-cmd-alt-4 = 'workspace 4'
ctrl-cmd-alt-5 = 'workspace 5'
ctrl-cmd-alt-6 = 'workspace 6'
ctrl-cmd-alt-7 = 'workspace 7'
ctrl-cmd-alt-8 = 'workspace 8'
ctrl-cmd-alt-9 = 'workspace 9'

ctrl-cmd-alt-a = 'workspace A'
ctrl-cmd-alt-b = 'workspace B'
ctrl-cmd-alt-c = 'workspace C'
ctrl-cmd-alt-d = 'workspace D'
ctrl-cmd-alt-e = 'workspace E'
ctrl-cmd-alt-m = 'workspace M'
ctrl-cmd-alt-n = 'workspace N'
ctrl-cmd-alt-o = 'workspace O'
ctrl-cmd-alt-p = 'workspace P'
ctrl-cmd-alt-r = 'workspace R'
ctrl-cmd-alt-s = 'workspace S'
ctrl-cmd-alt-t = 'workspace T'
ctrl-cmd-alt-u = 'workspace U'
ctrl-cmd-alt-v = 'workspace V'
ctrl-cmd-alt-z = 'workspace Z'

# ---------------------------------------------------------------------------
# Move window to workspace
#
# Hyper + Shift + <workspace>
# ---------------------------------------------------------------------------

ctrl-cmd-alt-shift-1 = 'move-node-to-workspace 1'
ctrl-cmd-alt-shift-2 = 'move-node-to-workspace 2'
ctrl-cmd-alt-shift-3 = 'move-node-to-workspace 3'
ctrl-cmd-alt-shift-4 = 'move-node-to-workspace 4'
ctrl-cmd-alt-shift-5 = 'move-node-to-workspace 5'
ctrl-cmd-alt-shift-6 = 'move-node-to-workspace 6'
ctrl-cmd-alt-shift-7 = 'move-node-to-workspace 7'
ctrl-cmd-alt-shift-8 = 'move-node-to-workspace 8'
ctrl-cmd-alt-shift-9 = 'move-node-to-workspace 9'

ctrl-cmd-alt-shift-a = 'move-node-to-workspace A'
ctrl-cmd-alt-shift-b = 'move-node-to-workspace B'
ctrl-cmd-alt-shift-c = 'move-node-to-workspace C'
ctrl-cmd-alt-shift-d = 'move-node-to-workspace D'
ctrl-cmd-alt-shift-e = 'move-node-to-workspace E'
ctrl-cmd-alt-shift-m = 'move-node-to-workspace M'
ctrl-cmd-alt-shift-n = 'move-node-to-workspace N'
ctrl-cmd-alt-shift-o = 'move-node-to-workspace O'
ctrl-cmd-alt-shift-p = 'move-node-to-workspace P'
ctrl-cmd-alt-shift-r = 'move-node-to-workspace R'
ctrl-cmd-alt-shift-s = 'move-node-to-workspace S'
ctrl-cmd-alt-shift-t = 'move-node-to-workspace T'
ctrl-cmd-alt-shift-u = 'move-node-to-workspace U'
ctrl-cmd-alt-shift-v = 'move-node-to-workspace V'
ctrl-cmd-alt-shift-z = 'move-node-to-workspace Z'

# ---------------------------------------------------------------------------
# Workspace / monitor navigation
# ---------------------------------------------------------------------------

# Switch between current and previous workspace
ctrl-cmd-alt-tab = 'workspace-back-and-forth'

# Move current workspace to the next monitor
ctrl-cmd-alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Keep these existing bindings as-is.
ctrl-alt-left = 'move-workspace-to-monitor --wrap-around prev'
ctrl-alt-right = 'move-workspace-to-monitor --wrap-around next'

# ---------------------------------------------------------------------------
# Service mode
# ---------------------------------------------------------------------------

ctrl-cmd-alt-shift-semicolon = 'mode service'
# ---------------------------------------------------------------------------
# Workspace monitor assignments
# ---------------------------------------------------------------------------

[workspace-to-monitor-force-assignment]
1 = 1
2 = [2, 1]
3 = [3, 2, 1]
4 = [4, 3, 2, 1]

5 = 1
6 = [2, 1]
7 = [3, 2, 1]
8 = [4, 3, 2, 1]

9 = 1

# ---------------------------------------------------------------------------
# Service mode
# ---------------------------------------------------------------------------

[mode.service.binding]

# Leave service mode.
# esc = 'mode main'
esc = ['reload-config', 'mode main']

# Reset the current workspace layout.
r = ['flatten-workspace-tree', 'mode main']

# Toggle the focused window between floating and tiled.
f = ['layout floating tiling', 'mode main']

# Close every window on this workspace except the focused one.
backspace = ['close-all-windows-but-current', 'mode main']

# Join containers.
alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

# Swap windows without changing the layout hierarchy.
# This command was added after your old config.
h = ['swap left', 'mode main']
j = ['swap down', 'mode main']
k = ['swap up', 'mode main']
l = ['swap right', 'mode main']

