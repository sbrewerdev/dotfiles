#: Core
allow_remote_control yes
listen_on unix:/tmp/kitty
shell_integration no-sudo
shell zsh --login --interactive

copy_on_select yes

include conf.d/fonts.conf
include conf.d/appearance.conf
include conf.d/cursor.conf
include conf.d/tabs.conf
include conf.d/layouts.conf
include conf.d/keybinds.conf
include conf.d/sessions.conf
include conf.d/leader-keybinds.conf

